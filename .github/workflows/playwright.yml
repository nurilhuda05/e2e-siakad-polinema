name: Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kode Sumber
      uses: actions/checkout@v4

    - name: Setup Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Install Playwright Browsers & OS Dependencies
      run: npx playwright install chromium --with-deps

    - name: Eksekusi Pengujian Playwright E2E
      run: npx playwright test
      env:
        SIAKAD_URL: https://siakad.polinema.ac.id/
        SIAKAD_NIM: ${{ secrets.SIAKAD_NIM }}
        SIAKAD_PASSWORD: ${{ secrets.SIAKAD_PASSWORD }}

    - name: Upload Test Report & Trace Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14